# Dune Tournament: web (nginx + React build), api (Node + shared engine), db (Postgres).
# Configuration comes from .env (see .env.example). Run one stack per environment:
#   docker compose -p dune-tournament-dev --env-file .env up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dune_tournament}
      POSTGRES_USER: ${POSTGRES_USER:-dune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dune} -d ${POSTGRES_DB:-dune_tournament}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dune}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dune_tournament}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PORT: "3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8090}:80"

volumes:
  db-data:
